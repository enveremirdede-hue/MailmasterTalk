<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MailmasterTalk Mega Pro - v8.9.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; touch-action: none; overscroll-behavior: none; }
        
        .video-matrix { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 1.25rem; 
            width: 100%; 
            height: 100%; 
            align-content: center; 
            justify-content: center;
            justify-items: center; /* Tek video olduğunda ortalasın */
            transition: all 0.3s ease-in-out; 
        }
        
        /* Ekran paylaşımı yapıldığında aktif olan alt şerit düzeni */
        .video-matrix.screen-active {
            display: flex; 
            flex-direction: row; 
            flex-wrap: nowrap; 
            height: 160px; 
            min-height: 160px;
            max-height: 160px;
            overflow-x: auto; 
            overflow-y: hidden; 
            align-items: center; 
            justify-content: flex-start;
            gap: 1rem;
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 1.25rem;
            border: 2px solid rgba(51, 65, 85, 0.5);
            z-index: 40;
        }
        
        .video-matrix.screen-active .video-wrapper { 
            width: 240px; 
            height: 135px; 
            flex-shrink: 0; 
            aspect-ratio: 16/9; 
            max-width: none;
            max-height: none;
        }

        /* ÇÖZÜM: Tek başına olan ekran devasa boyuta ulaşıp ismi ezmesin diye sınırlandı */
        .video-wrapper { 
            position: relative; 
            background: #0f172a; 
            border-radius: 1rem; 
            overflow: hidden; 
            border: 3px solid #1e293b; 
            aspect-ratio: 16/9; 
            width: 100%;
            max-width: 640px; /* En fazla bu kadar büyüyebilir */
            max-height: 360px;
            box-shadow: 0 15px 25px -5px rgba(0,0,0,0.4); 
            transition: all 0.3s ease; 
        }
        
        video { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: 10; 
        }
        .local-mirror { transform: scaleX(-1); }
        
        .avatar-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            z-index: 15;
        }

        /* Kesinlikle en üst katmanda kalması için z-index yükseltildi */
        .user-tag { 
            position: absolute; 
            bottom: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.9); 
            color: #ffffff; 
            padding: 6px 12px; 
            border-radius: 0.5rem; 
            font-size: 0.8rem; 
            font-weight: 700; 
            backdrop-filter: blur(8px); 
            border: 1px solid rgba(255,255,255,0.2); 
            z-index: 50; /* En üst katmana taşındı */
            display: flex; 
            align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            pointer-events: none;
            white-space: nowrap;
        }

        .filter-noir { filter: grayscale(100%) contrast(1.3); }
        .filter-cyber { filter: hue-rotate(85deg) saturate(2.5) contrast(1.1); }
        .filter-sepia { filter: sepia(85%) saturate(1.2); }
        
        @keyframes emojiAnimation {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            15% { opacity: 1; }
            65% { opacity: 1; }
            90%, 100% { transform: translateY(-50vh) scale(1.2) rotate(15deg); opacity: 0; }
        }
        .neon-emoji { position: fixed; bottom: 140px; font-size: 4rem; pointer-events: none; z-index: 999999; animation: emojiAnimation 2.5s ease-out forwards; filter: drop-shadow(0 0 12px rgba(255,255,255,0.5)); }

        .wb-tool { padding: 10px 14px; border-radius: 0.75rem; color: #94a3b8; transition: all 0.2s; cursor: pointer; }
        .wb-tool:hover { color: #f8fafc; background: rgba(255,255,255,0.1); }
        .wb-tool.active { background: #10b981; color: white; box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.4); }
        .wb-color { cursor: pointer; transition: transform 0.2s; }
        .wb-color.active { border-color: white !important; transform: scale(1.15); box-shadow: 0 0 8px rgba(255,255,255,0.5); }
        
        #whiteboard { touch-action: none; user-select: none; -webkit-user-select: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

    <script>
        const SUPABASE_URL = "https://atupjeqlzpuqzjpxkjri.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_AIwx6jSgROBXJeaAs-zzQw_Oo1Zz9Vd"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
        const myClientId = Math.random().toString(36).substring(2, 15);

        const avatarColors = ["bg-orange-600", "bg-blue-600", "bg-purple-600", "bg-emerald-600", "bg-pink-600", "bg-indigo-600", "bg-amber-600"];
        function getRandomAvatarColor() { return avatarColors[Math.floor(Math.random() * avatarColors.length)]; }

        const videoGrid = document.getElementById('video-grid');
        const localVideo = document.getElementById('localVideo');
        const screenVideo = document.getElementById('screenVideo');
        const screenShareView = document.getElementById('screen-share-view');
        const whiteboardCanvas = document.getElementById('whiteboard');
        const boardCtx = whiteboardCanvas.getContext('2d', { willReadFrequently: true });
        const toggleScreenVisibilityBtn = document.getElementById('toggle-screen-visibility-btn');
        const globalRecordingNotice = document.getElementById('global-recording-notice');
        
        let localStream, screenStream, p2pChannel, realTimeDBChannel;
        let peerConnections = {}; let screenPCs = {}; let iceQueues = {};        
        let userName = "Anonim"; let currentRoomId = ""; let isScreenSharing = false;
        let isDrawing = false; let currentTool = 'pen'; let currentColor = '#1e293b'; let startX = 0, startY = 0; let wbSnapshot = null;
        let isHandRaised = false; 
        
        let mediaRecorder = null; let recordedChunks = []; let combinedAudioStream = null;
        
        let dbWhiteboardHistory = []; let wbSaveBuffer = [];
        let isMicMuted = false; let isCamOff = false; let isScreenHiddenByMe = false;

        function forceHDAudioSDP(sdp) {
            if (sdp.indexOf('useinbandfec=1') !== -1) {
                return sdp.replace('useinbandfec=1', 'useinbandfec=1;maxaveragebitrate=128000;stereo=1;sprop-stereo=1');
            }
            return sdp;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) document.getElementById('room-input').value = decodeURIComponent(roomParam);

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: { echoCancellation: true, noiseSuppression: true } });
                localVideo.srcObject = localStream;
                setupWhiteboardEngine();
            } catch (e) { console.error("Cihaz izin hatası:", e); }
        });

        document.getElementById('join-btn').onclick = () => {
            const rId = document.getElementById('room-input').value.trim();
            const uName = document.getElementById('username-input').value.trim();
            if(!rId || !uName) return alert("Bilgileri doldurun.");
            userName = uName; currentRoomId = rId;
            
            const localAvatar = document.getElementById('local-avatar');
            localAvatar.innerText = userName.charAt(0).toUpperCase();
            localAvatar.className = `avatar-placeholder hidden text-5xl ${getRandomAvatarColor()}`;

            document.getElementById('local-name-tag').innerText = userName + " (Siz)";
            document.getElementById('current-room-text').innerText = rId;
            
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('main-header').classList.add('flex');
            document.getElementById('main-footer').classList.remove('hidden');
            document.getElementById('main-footer').classList.add('flex');

            initSupabaseMeshNetwork(rId);
            initSupabaseRealTimeDatabase(rId);
            loadRoomDataFromDatabase(rId);
            setInterval(flushWhiteboardBuffer, 400);
        };

        function initSupabaseRealTimeDatabase(roomCode) {
            realTimeDBChannel = supabaseClient.channel('realtime_db_changes');
            realTimeDBChannel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'talk_chat', filter: `room_id=eq.${roomCode}` }, (payload) => {
                if (payload.new.sender !== userName) renderChatMessage(payload.new.sender, payload.new.text, false);
            });
            realTimeDBChannel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'talk_whiteboard', filter: `room_id=eq.${roomCode}` }, (payload) => {
                const stroke = payload.new;
                if (!stroke.sender || stroke.sender !== myClientId) { dbWhiteboardHistory.push(stroke); remoteDrawAction(stroke); }
            });
            realTimeDBChannel.on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'talk_whiteboard', filter: `room_id=eq.${roomCode}` }, () => {
                dbWhiteboardHistory = []; wbSaveBuffer = []; boardCtx.clearRect(0, 0, whiteboardCanvas.width, whiteboardCanvas.height);
            });
            realTimeDBChannel.subscribe();
        }

        async function loadRoomDataFromDatabase(roomCode) {
            try {
                const { data: chatData } = await supabaseClient.from('talk_chat').select('*').eq('room_id', roomCode).order('created_at', { ascending: true });

        function initSupabaseMeshNetwork(roomCode) {
            p2pChannel = supabaseClient.channel(`mailmaster_mega_${roomCode}`, { config: { presence: { key: myClientId } } });
            p2pChannel
                .on('presence', { event: 'sync' }, () => handlePresenceSync(p2pChannel.presenceState()))
                .on('broadcast', { event: 'signal' }, ({ payload }) => { if (payload.targetId === myClientId) handleInboundSignal(payload); })
                .on('broadcast', { event: 'emoji' }, ({ payload }) => showEmojiAnimation(payload.emoji))
                .on('broadcast', { event: 'hand-toggle' }, ({ payload }) => {
                    const targetBadge = document.getElementById(`hand_badge_${payload.userId}`);
                    if (targetBadge) { payload.isHandRaised ? targetBadge.classList.remove('hidden') : targetBadge.classList.add('hidden'); }

                    const icon = document.getElementById(`mic_icon_${payload.userId}`);
                    if (icon) icon.className = payload.isMuted ? "fa-solid fa-microphone-slash text-red-500 mr-2" : "fa-solid fa-microphone text-emerald-400 mr-2";
                })
                .on('broadcast', { event: 'cam-toggle' }, ({ payload }) => {
                    const targetVideo = document.getElementById(`video_${payload.userId}_cam`);
                    const targetAvatar = document.getElementById(`avatar_${payload.userId}`);
                    if (payload.isCamOff) {
                        if(targetVideo) targetVideo.classList.add('hidden');
                        if(targetAvatar) targetAvatar.classList.remove('hidden');
                    } else {
                        if(targetVideo) targetVideo.classList.remove('hidden');
                        if(targetAvatar) targetAvatar.classList.add('hidden');
                    }
                })
                .on('broadcast', { event: 'screen-offer' }, () => {
                    if(!isScreenHiddenByMe) {
                        screenShareView.classList.remove('hidden');
                        videoGrid.classList.add('screen-active');
                    }
                    toggleScreenVisibilityBtn.classList.remove('hidden');
                })
                .on('broadcast', { event: 'screen-stop' }, ({ payload }) => {
                    if (screenPCs[payload.userId]) { screenPCs[payload.userId].close(); delete screenPCs[payload.userId]; }
                    resetScreenShareUI();
                })
                .on('broadcast', { event: 'clear-board-signal' }, () => {
                    dbWhiteboardHistory = []; wbSaveBuffer = []; boardCtx.clearRect(0, 0, whiteboardCanvas.width, whiteboardCanvas.height);
                })
                .on('broadcast', { event: 'recording-state-changed' }, ({ payload }) => {
                    if(payload.isRecording) { globalRecordingNotice.classList.remove('hidden'); } 
                    else { globalRecordingNotice.classList.add('hidden'); }
                })
                .subscribe(async (status) => { if (status === 'SUBSCRIBED') { await p2pChannel.track({ name: userName }); } });

        function handlePresenceSync(state) {
            Object.keys(peerConnections).forEach(id => { if (!state[id]) removeUserConnection(id); });
            Object.keys(state).forEach(id => {
                if (id === myClientId) return;
                const remoteName = (state[id] && state[id][0]) ? state[id][0].name : "Katılımcı";
                if (myClientId > id && !peerConnections[id]) buildWebRTCLink(id, remoteName, true);
            });
        }

        async function handleInboundSignal(data) {
            const rId = data.senderId;
            switch (data.type) {
                case 'offer':
                    await buildWebRTCLink(rId, data.senderName, false);
                    await peerConnections[rId].setRemoteDescription(new RTCSessionDescription(data.offer));
                    if (iceQueues[rId]) { while(iceQueues[rId].length > 0) { await peerConnections[rId].addIceCandidate(iceQueues[rId].shift()); } }
                    const answer = await peerConnections[rId].createAnswer(); answer.sdp = forceHDAudioSDP(answer.sdp);
                    await peerConnections[rId].setLocalDescription(answer);
                    sendSignalData({ type: 'answer', answer: answer, senderName: userName }, rId);
                    break;
                case 'answer':
                    if (peerConnections[rId]) {
                        await peerConnections[rId].setRemoteDescription(new RTCSessionDescription(data.answer));
                        if (iceQueues[rId]) { while(iceQueues[rId].length > 0) { await peerConnections[rId].addIceCandidate(iceQueues[rId].shift()); } }
                    }
                    break;
                case 'ice':
                    if (peerConnections[rId] && peerConnections[rId].remoteDescription) { await peerConnections[rId].addIceCandidate(new RTCIceCandidate(data.candidate)); }
                    else { if (!iceQueues[rId]) iceQueues[rId] = []; iceQueues[rId].push(new RTCIceCandidate(data.candidate)); }
                    break;
                case 'screen-offer':
                    const spc = new RTCPeerConnection(rtcConfig); screenPCs[rId] = spc;
                    spc.ontrack = ev => {
                        screenVideo.srcObject = ev.streams[0];
                        screenVideo.play().catch(e => console.log("Oynatma hatası:", e)); // Handshake onarımı
                        if(!isScreenHiddenByMe) {
                            screenShareView.classList.remove('hidden'); videoGrid.classList.add('screen-active');
                        }
                        toggleScreenVisibilityBtn.classList.remove('hidden');
                    };
                    spc.onicecandidate = ev => { if (ev.candidate) sendSignalData({ type: 'screen-ice', candidate: ev.candidate }, rId); };
                    await spc.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const sAnswer = await spc.createAnswer(); await spc.setLocalDescription(sAnswer);
                    sendSignalData({ type: 'screen-answer', answer: sAnswer }, rId);
                    break;
                case 'screen-answer':
                    if (screenPCs[rId]) { await screenPCs[rId].setRemoteDescription(new RTCSessionDescription(data.answer)); }
                    break;
                case 'screen-ice': 
                    if(screenPCs[rId] && screenPCs[rId].remoteDescription) { await screenPCs[rId].addIceCandidate(new RTCIceCandidate(data.candidate)); }
                    break;
            }
        }

        async function buildWebRTCLink(remoteId, remoteName, isInitiator) {
            if (peerConnections[remoteId]) return;
            const pc = new RTCPeerConnection(rtcConfig); peerConnections[remoteId] = pc;
            if (localStream) { localStream.getTracks().forEach(track => pc.addTrack(track, localStream)); }
            pc.onicecandidate = ev => { if (ev.candidate) sendSignalData({ type: 'ice', candidate: ev.candidate }, remoteId); };
            pc.ontrack = ev => { if (ev.track.kind === 'video') createVideoCard(remoteId, remoteName, ev.streams[0]); };
            if (isInitiator) {
                const offer = await pc.createOffer(); offer.sdp = forceHDAudioSDP(offer.sdp);
                await pc.setLocalDescription(offer);
                sendSignalData({ type: 'offer', offer: offer, senderName: userName }, remoteId);
            }
        }

        function sendSignalData(payload, targetId) { p2pChannel.send({ type: 'broadcast', event: 'signal', payload: { ...payload, senderId: myClientId, targetId: targetId } }); }

        recordStartBtn.onclick = async (e) => {
            e.stopPropagation();
            try {
                const displayStream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: { width: 1280, height: 720, frameRate: 30 },
                    audio: true 
                });
                
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const mixedOutput = audioCtx.createMediaStreamDestination();
                let hasAudioTracks = false;

                if (displayStream.getAudioTracks().length > 0) {
                    const systemSource = audioCtx.createMediaStreamSource(new MediaStream([displayStream.getAudioTracks()[0]]));
                    systemSource.connect(mixedOutput);
                    hasAudioTracks = true;
                }

                if (localStream && localStream.getAudioTracks().length > 0) {
                    const micSource = audioCtx.createMediaStreamSource(new MediaStream([localStream.getAudioTracks()[0]]));
                    micSource.connect(mixedOutput);
                    hasAudioTracks = true;
                }

                const tracks = [displayStream.getVideoTracks()[0]];
                if (hasAudioTracks) {
                    tracks.push(mixedOutput.stream.getAudioTracks()[0]);
                }

                combinedAudioStream = new MediaStream(tracks);
                recordedChunks = [];
                
                mediaRecorder = new MediaRecorder(combinedAudioStream, { mimeType: 'video/webm; codecs=vp9' });
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `MailmasterTalk-Kayit-${Date.now()}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                    }, 100);
                    
                    displayStream.getTracks().forEach(track => track.stop());
                    if(combinedAudioStream) combinedAudioStream.getTracks().forEach(track => track.stop());
                    audioCtx.close();

                    recordingControlsGroup.classList.add('hidden');
                    recordStartBtn.classList.remove('hidden');
                    recordPauseBtn.innerHTML = `<i class="fa-solid fa-pause text-xs"></i> Kaydı Durdur ve Devam Et`;
                    
                    globalRecordingNotice.classList.add('hidden');
                    if(p2pChannel) p2pChannel.send({ type: 'broadcast', event: 'recording-state-changed', payload: { isRecording: false } });
                };

                mediaRecorder.start(1000);
                
                recordStartBtn.classList.add('hidden');
                recordingControlsGroup.classList.remove('hidden');
                closeMoreMenu();

                globalRecordingNotice.classList.remove('hidden');
                if(p2pChannel) p2pChannel.send({ type: 'broadcast', event: 'recording-state-changed', payload: { isRecording: true } });

            } catch (err) {
                console.error("Kayıt başlatılamadı:", err);
            }
        };

        function setupWhiteboardEngine() {
            document.querySelectorAll('.wb-tool').forEach(btn => {
                btn.onclick = () => { document.querySelectorAll('.wb-tool').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentTool = btn.dataset.tool; }
            });
            document.querySelectorAll('.wb-color').forEach(btn => {
                btn.onclick = () => { document.querySelectorAll('.wb-color').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentColor = btn.dataset.color; }
            });
            document.getElementById('custom-color-picker').oninput = (e) => { currentColor = e.target.value; };

            whiteboardCanvas.addEventListener('pointerdown', (e) => {
                isDrawing = true; whiteboardCanvas.setPointerCapture(e.pointerId);
                const coords = getCanvasCoordinates(e); startX = coords[0]; startY = coords[1];
                wbSnapshot = boardCtx.getImageData(0, 0, whiteboardCanvas.width, whiteboardCanvas.height);
            });

            whiteboardCanvas.addEventListener('pointermove', (e) => {
                if (!isDrawing) return; 
                const coords = getCanvasCoordinates(e); const curX = coords[0]; const curY = coords[1];
                if (currentTool === 'pen' || currentTool === 'eraser') {
                    drawShape(currentTool, startX, startY, curX, curY, currentColor);
                    const drawData = { room_id: currentRoomId, sender: myClientId, type: currentTool, x1: startX, y1: startY, x2: curX, y2: curY, color: currentColor, w: whiteboardCanvas.width, h: whiteboardCanvas.height };
                    dbWhiteboardHistory.push(drawData); wbSaveBuffer.push(drawData); startX = curX; startY = curY;
                } else { boardCtx.putImageData(wbSnapshot, 0, 0); drawShape(currentTool, startX, startY, curX, curY, currentColor); }
            });

            whiteboardCanvas.addEventListener('pointerup', (e) => {
                if (!isDrawing) return; isDrawing = false; whiteboardCanvas.releasePointerCapture(e.pointerId);
                const coords = getCanvasCoordinates(e); const curX = coords[0]; const curY = coords[1];
                if (currentTool !== 'pen' && currentTool !== 'eraser') {
                    boardCtx.putImageData(wbSnapshot, 0, 0); drawShape(currentTool, startX, startY, curX, curY, currentColor);
                    const drawData = { room_id: currentRoomId, sender: myClientId, type: currentTool, x1: startX, y1: startY, x2: curX, y2: curY, color: currentColor, w: whiteboardCanvas.width, h: whiteboardCanvas.height };
                    dbWhiteboardHistory.push(drawData); wbSaveBuffer.push(drawData);
                }
                flushWhiteboardBuffer(); 
            });
        }

        async function flushWhiteboardBuffer() {

        function getCanvasCoordinates(e) {
            const rect = whiteboardCanvas.getBoundingClientRect();
            return [ (e.clientX - rect.left) * (whiteboardCanvas.width / rect.width), (e.clientY - rect.top) * (whiteboardCanvas.height / rect.height) ];
        }

        function drawShape(type, x1, y1, x2, y2, color) {
            boardCtx.lineCap = 'round'; boardCtx.lineJoin = 'round'; boardCtx.beginPath();
            boardCtx.strokeStyle = type === 'eraser' ? '#ffffff' : color; boardCtx.lineWidth = type === 'eraser' ? 24 : 4;
            if (type === 'pen' || type === 'eraser' || type === 'line') { boardCtx.moveTo(x1, y1); boardCtx.lineTo(x2, y2); }
            else if (type === 'rect') { boardCtx.rect(x1, y1, x2 - x1, y2 - y1); }
            else if (type === 'circle') { boardCtx.arc(x1, y1, Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2)), 0, 2 * Math.PI); }
            boardCtx.stroke();
        }

        function remoteDrawAction(strokeData) {
            const scaleX = whiteboardCanvas.width / strokeData.w; const scaleY = whiteboardCanvas.height / strokeData.h;
            drawShape(strokeData.type, strokeData.x1 * scaleX, strokeData.y1 * scaleY, strokeData.x2 * scaleX, strokeData.y2 * scaleY, strokeData.color);
        }

        function redrawWhiteboardFromHistory() {
            boardCtx.clearRect(0, 0, whiteboardCanvas.width, whiteboardCanvas.height);
            dbWhiteboardHistory.forEach(stroke => {
                const scaleX = whiteboardCanvas.width / stroke.w; const scaleY = stroke.h ? (whiteboardCanvas.height / stroke.h) : 1;
                drawShape(stroke.type, stroke.x1 * scaleX, stroke.y1 * scaleY, stroke.x2 * scaleX, stroke.y2 * scaleY, stroke.color);
            });
        }

        function resizeCanvasToDisplay() {

                    whiteboardCanvas.width = rect.width; whiteboardCanvas.height = rect.height;
                    redrawWhiteboardFromHistory();

            }
        }

        function forceHDAudioSDP(sdp) {
            if (sdp.indexOf('useinbandfec=1') !== -1) {

        // =========================================================================
        // GELİŞMİŞ SYNTH-AUDIO SES EFEKTLERİ VE AMBİYANS MÜZİK MOTORU
        // =========================================================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let backgroundMusicNode = null;
        let backgroundMusicGain = null;

        function playSoundEffect(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;

            if (type === 'join') { // Katılma Sesi (Yukarı doğru tırmanan tonlar)
                osc1.type = 'sine'; osc1.frequency.setValueAtTime(300, now);
                osc1.frequency.exponentialRampToValueAtTime(600, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc1.start(now); osc1.stop(now + 0.3);
            } 
            else if (type === 'leave') { // Ayrılma Sesi (Aşağı doğru düşen tonlar)
                osc1.type = 'sine'; osc1.frequency.setValueAtTime(550, now);
                osc1.frequency.exponentialRampToValueAtTime(250, now + 0.35);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc1.start(now); osc1.stop(now + 0.35);
            } 
            else if (type === 'share-toggle') { // Ekran Paylaşma Sesi (Akustik tıklama ve parlama)
                osc1.type = 'triangle'; osc1.frequency.setValueAtTime(440, now);
                osc1.frequency.setValueAtTime(880, now + 0.08);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc1.start(now); osc1.stop(now + 0.2);
            } 
            else if (type === 'copy-success') { // Yeşil Tik Sesi (Kısa iki tık ritmi)
                osc1.type = 'sine'; osc1.frequency.setValueAtTime(600, now);
                osc1.frequency.setValueAtTime(1200, now + 0.05);
                gainNode.gain.setValueAtTime(0.15, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc1.start(now); osc1.stop(now + 0.15);
            }
            else if (type === 'record-start') { // Kayıt Başlama (Hızlı kesik sinyal)
                osc1.type = 'square'; osc1.frequency.setValueAtTime(800, now);
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc1.start(now); osc1.stop(now + 0.1);
            }
            else if (type === 'record-pause') { // Kayıt Duraklama
                osc1.type = 'sine'; osc1.frequency.setValueAtTime(400, now);
                gainNode.gain.setValueAtTime(0.15, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc1.start(now); osc1.stop(now + 0.15);
            }
            else if (type === 'record-resume') { // Kayıt Devam Etme
                osc1.type = 'sine'; osc1.frequency.setValueAtTime(400, now);
                osc1.frequency.setValueAtTime(700, now + 0.08);
                gainNode.gain.setValueAtTime(0.15, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc1.start(now); osc1.stop(now + 0.15);
            }
            else if (type === 'raise-hand') {
                osc1.type = 'sine'; osc2.type = 'triangle';
                osc1.frequency.setValueAtTime(180, now); osc2.frequency.setValueAtTime(185, now);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc1.start(now); osc2.start(now); osc1.stop(now + 0.4); osc2.stop(now + 0.4);
            }
        }

        // Dinamik Minimalist Lo-Fi/Meditasyon Melodi Üreteci (Arka Plan Müziği)
        function startProceduralAmbientMusic() {
            if (backgroundMusicNode) return; 
            if (audioCtx.state === 'suspended') audioCtx.resume();

            backgroundMusicGain = audioCtx.createGain();
            backgroundMusicGain.gain.setValueAtTime(0.04, audioCtx.currentTime); // Çok kısık, rahatsız etmeyen seviye
            backgroundMusicGain.connect(audioCtx.destination);

            let isPlaying = true;
            const notes = [261.63, 293.66, 329.63, 392.00, 440.00]; // Pentatonik dinlendirici dizi (C4, D4, E4, G4, A4)

            function playNextNote() {
                if (!isPlaying) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const noteGain = audioCtx.createGain();
                
                osc.type = 'sine';
                const randomNote = notes[Math.floor(Math.random() * notes.length)];
                osc.frequency.setValueAtTime(randomNote, now);
                
                // Yumuşak atak ve sönümlenme süresi (Sakin bir çan efekti gibi)
                noteGain.gain.setValueAtTime(0, now);
                noteGain.gain.linearRampToValueAtTime(0.4, now + 1.5);
                noteGain.gain.exponentialRampToValueAtTime(0.001, now + 4.0);
                
                osc.connect(noteGain);
                noteGain.connect(backgroundMusicGain);
                
                osc.start(now);
                osc.stop(now + 4.0);
                
                setTimeout(playNextNote, 3000 + Math.random() * 2000);
            }

            backgroundMusicNode = { stop: () => { isPlaying = false; } };
            playNextNote();
        }

        function stopProceduralAmbientMusic() {

                backgroundMusicNode.stop();

            p2pChannel

                .on('broadcast', { event: 'hand-toggle' }, ({ payload }) => {

            if (lastUserCount !== 0) {
                if (currentUsersCount > lastUserCount) {

                } else if (currentUsersCount < lastUserCount) {

            Object.keys(peerConnections).forEach(id => { if (!state[id]) removeUserConnection(id); });
            Object.keys(state).forEach(id => {
                if (id === myClientId) return;
                const remoteUserData = (state[id] && state[id][0]) ? state[id][0] : null;

                if (myClientId > id && !peerConnections[id]) {

            p2pChannel.send({
                type: 'broadcast',

        async function handleInboundSignal(data) {
            const rId = data.senderId;
            switch (data.type) {
                case 'offer':
                    await buildWebRTCLink(rId, data.senderName, false);
                    await peerConnections[rId].setRemoteDescription(new RTCSessionDescription(data.offer));
                    if (iceQueues[rId]) { while(iceQueues[rId].length > 0) { await peerConnections[rId].addIceCandidate(iceQueues[rId].shift()); } }
                    const answer = await peerConnections[rId].createAnswer(); answer.sdp = forceHDAudioSDP(answer.sdp);
                    await peerConnections[rId].setLocalDescription(answer);
                    sendSignalData({ type: 'answer', answer: answer, senderName: userName }, rId);
                    break;
                case 'answer':
                    if (peerConnections[rId]) {
                        await peerConnections[rId].setRemoteDescription(new RTCSessionDescription(data.answer));
                        if (iceQueues[rId]) { while(iceQueues[rId].length > 0) { await peerConnections[rId].addIceCandidate(iceQueues[rId].shift()); } }
                    }
                    break;
                case 'ice':
                    if (peerConnections[rId] && peerConnections[rId].remoteDescription) {
                        await peerConnections[rId].addIceCandidate(new RTCIceCandidate(data.candidate));
                    } else {
                        if (!iceQueues[rId]) iceQueues[rId] = [];
                        iceQueues[rId].push(new RTCIceCandidate(data.candidate));
                    }
                    break;
                case 'screen-offer':
                    const spc = new RTCPeerConnection(rtcConfig);
                    screenPCs[rId] = spc;
                    spc.ontrack = ev => {
                        screenVideo.srcObject = ev.streams[0];
                        screenVideo.play().catch(e => console.log(e));
                        if(!isScreenHiddenByMe) {
                            screenShareView.classList.remove('hidden');
                            videoGrid.classList.add('screen-active');
                        }
                        toggleScreenVisibilityBtn.classList.remove('hidden');
                    };
                    spc.onicecandidate = ev => {
                        if (ev.candidate) sendSignalData({ type: 'screen-ice', candidate: ev.candidate }, rId);
                    };
                    await spc.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const sAnswer = await spc.createAnswer();
                    await spc.setLocalDescription(sAnswer);
                    sendSignalData({ type: 'screen-answer', answer: sAnswer }, rId);
                    break;
                case 'screen-answer':
                    if (screenPCs[rId]) { await screenPCs[rId].setRemoteDescription(new RTCSessionDescription(data.answer)); }
                    break;
                case 'screen-ice':
                    if(screenPCs[rId] && screenPCs[rId].remoteDescription) { await screenPCs[rId].addIceCandidate(new RTCIceCandidate(data.candidate)); }
                    break;
            }
        }

        supabaseClient.channel('screen_resync_watcher').on('broadcast', { event: 'request-screen-resync' }, async ({ payload }) => {
            if (payload.targetId === myClientId && isScreenSharing && screenStream) {
                const targetPeerId = payload.requesterId;
                const spc = new RTCPeerConnection(rtcConfig);
                screenPCs[targetPeerId] = spc;
                screenStream.getTracks().forEach(track => spc.addTrack(track, screenStream));
                spc.onicecandidate = ev => {
                    if (ev.candidate) sendSignalData({ type: 'screen-ice', candidate: ev.candidate }, targetPeerId);
                };
                const offer = await spc.createOffer();
                await spc.setLocalDescription(offer);
                sendSignalData({ type: 'screen-offer', offer: offer }, targetPeerId);
            }
        }).subscribe();

        async function buildWebRTCLink(remoteId, remoteName, isInitiator) {
            if (peerConnections[remoteId]) return;
            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections[remoteId] = pc;
            if (localStream) { localStream.getTracks().forEach(track => pc.addTrack(track, localStream)); }
            pc.onicecandidate = ev => { if (ev.candidate) sendSignalData({ type: 'ice', candidate: ev.candidate }, remoteId); };
            pc.ontrack = ev => { if (ev.track.kind === 'video') createVideoCard(remoteId, remoteName, ev.streams[0]); };
            if (isInitiator) {
                const offer = await pc.createOffer(); offer.sdp = forceHDAudioSDP(offer.sdp);
                await pc.setLocalDescription(offer);
                sendSignalData({ type: 'offer', offer: offer, senderName: userName }, remoteId);
            }
        }

                    newBtn.onclick = function(e) { e.stopPropagation(); syncSelection(`custom_${i}`); };
                    grid.insertBefore(newBtn, uploadControl);

                    const option = document.createElement('option'); option.value = `custom_${i}`;
                    option.className = 'dynamic-custom-bg-opt text-slate-900 bg-white'; option.textContent = `Arka Plan ${count}`;
                    filterSelect.appendChild(option);
                    count++;
                }
            }
        }

        function syncSelection(value) {
            localStorage.setItem('saved_bg_type', value);
            if (filterSelect) filterSelect.value = value;
            const modal = document.getElementById('bg-transform-modal');
            if (modal) {
                modal.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('border-emerald-500'));
                const activeBtn = modal.querySelector(`[data-bg="${value}"]`);
                if (activeBtn) activeBtn.classList.add('border-emerald-500');
            }
            applyIntegratedFilterAndBG(value);
        }

        function applyIntegratedFilterAndBG(value) {
            if (!localVideo) return;
            const parent = localVideo.parentElement; let bgWrapper = parent.querySelector('.bg-effect-wrapper');

            if (!bgWrapper) {
                bgWrapper = document.createElement('div');
                bgWrapper.className = 'bg-effect-wrapper absolute inset-0 w-full h-full pointer-events-none z-30 bg-cover bg-center';
                parent.style.position = 'relative'; parent.appendChild(bgWrapper);
            }

            localVideo.style.filter = 'none'; localVideo.style.webkitMaskImage = 'none'; localVideo.style.maskImage = 'none';
            bgWrapper.style.backgroundImage = 'none'; bgWrapper.style.backdropFilter = 'none'; bgWrapper.style.webkitBackdropFilter = 'none';

            if (value === 'none' || !value) { bgWrapper.remove(); } 
            else if (value === 'sepia') { bgWrapper.remove(); localVideo.style.filter = 'sepia(85%) saturate(1.2)'; } 
            else if (value === 'noir') { bgWrapper.remove(); localVideo.style.filter = 'grayscale(100%) contrast(1.3)'; } 
            else if (value === 'cyber') { bgWrapper.remove(); localVideo.style.filter = 'hue-rotate(85deg) saturate(2.5) contrast(1.1)'; } 
            else if (value === 'blur') {
                bgWrapper.style.backdropFilter = 'blur(12px) brightness(0.9)'; bgWrapper.style.webkitBackdropFilter = 'blur(12px) brightness(0.9)';
                bgWrapper.style.webkitMaskImage = 'radial-gradient(circle at 50% 55%, transparent 25%, black 70%)';
                bgWrapper.style.maskImage = 'radial-gradient(circle at 50% 55%, transparent 25%, black 70%)';
            } else if (value.startsWith('custom_')) {
                const slotId = value.split('_')[1]; const imgSrc = localStorage.getItem(`saved_bg_custom_src_${slotId}`);
                if (imgSrc) {
                    bgWrapper.style.backgroundImage = `url('${imgSrc}')`;
                    bgWrapper.style.webkitMaskImage = 'radial-gradient(circle at 50% 50%, transparent 30%, black 65%)';
                    bgWrapper.style.maskImage = 'radial-gradient(circle at 50% 50%, transparent 30%, black 65%)';
                } else { bgWrapper.remove(); }
            } else if (bgImages[value]) {
                bgWrapper.style.backgroundImage = `url('${bgImages[value]}')`;
                bgWrapper.style.webkitMaskImage = 'radial-gradient(circle at 50% 50%, transparent 30%, black 65%)';
                bgWrapper.style.maskImage = 'radial-gradient(circle at 50% 50%, transparent 30%, black 65%)';
            }
        }

        // =========================================================================
        // GEOMETRİK BEYAZ TAHTA MOTORU
        // =========================================================================
        function setupWhiteboardEngine() {
            const resizeBoard = () => {
                const rect = whiteboardCanvas.parentElement.getBoundingClientRect();
                whiteboardCanvas.width = rect.width; whiteboardCanvas.height = rect.height; redrawWhiteboardFromHistory();
            };
            window.addEventListener('resize', resizeBoard);
            document.getElementById('view-board-btn').onclick = () => {
                document.getElementById('whiteboard-container').classList.remove('hidden');
                document.getElementById('view-board-btn').className = "bg-emerald-500 text-white px-5 h-11 rounded-lg text-sm font-bold flex items-center shadow-md transition-all tracking-wide";
                document.getElementById('view-grid-btn').className = "text-slate-400 hover:text-white px-5 h-11 rounded-lg text-sm font-bold flex items-center transition-all tracking-wide";
                resizeBoard();
            };
            document.getElementById('view-grid-btn').onclick = () => {
                document.getElementById('whiteboard-container').classList.add('hidden');
                document.getElementById('view-grid-btn').className = "bg-emerald-500 text-white px-5 h-11 rounded-lg text-sm font-bold flex items-center shadow-md transition-all tracking-wide";
                document.getElementById('view-board-btn').className = "text-slate-400 hover:text-white px-5 h-11 rounded-lg text-sm font-bold flex items-center transition-all tracking-wide";
            };
            document.querySelectorAll('.wb-tool').forEach(btn => {
                btn.onclick = () => { document.querySelectorAll('.wb-tool').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentTool = btn.dataset.tool; };
            });
            document.querySelectorAll('.wb-color').forEach(btn => {
                btn.onclick = () => { document.querySelectorAll('.wb-color').forEach(b => b.classList.remove('active', 'border-slate-400')); btn.classList.add('active'); currentColor = btn.dataset.color; };
            });
            document.getElementById('custom-color-picker').oninput = (e) => { currentColor = e.target.value; document.querySelectorAll('.wb-color').forEach(b => b.classList.remove('active')); };
            document.getElementById('clear-board-btn').onclick = async () => {
                if (confirm("Tahtayı herkes için temizlemek istiyor musunuz?")) {
                    dbWhiteboardHistory = []; wbSaveBuffer = []; boardCtx.clearRect(0, 0, whiteboardCanvas.width, whiteboardCanvas.height);
                    p2pChannel.send({ type: 'broadcast', event: 'clear-board-signal', payload: {} });
                    try { await supabaseClient.from('talk_whiteboard').delete().eq('room_id', currentRoomId); } catch(e){}
                }
            };

            const getPos = e => {
                const rect = whiteboardCanvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const drawStart = e => { if (currentRoomId === "") return; isDrawing = true; const p = getPos(e); startX = p.x; startY = p.y; wbSnapshot = boardCtx.getImageData(0,0,whiteboardCanvas.width,whiteboardCanvas.height); };
            const drawMove = e => {
                if (!isDrawing) return; e.preventDefault(); const p = getPos(e);
                if (currentTool !== 'pen' && currentTool !== 'eraser' && wbSnapshot) boardCtx.putImageData(wbSnapshot, 0, 0);
                boardCtx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
                boardCtx.lineWidth = currentTool === 'eraser' ? 30 : 4; boardCtx.lineCap = 'round'; boardCtx.lineJoin = 'round';

                if (currentTool === 'pen' || currentTool === 'eraser') {
                    boardCtx.beginPath(); boardCtx.moveTo(startX, startY); boardCtx.lineTo(p.x, p.y); boardCtx.stroke();
                    pushStrokeToBuffer('line', startX, startY, p.x, p.y, boardCtx.strokeStyle, boardCtx.lineWidth);
                    startX = p.x; startY = p.y;
                } else if (currentTool === 'rect') { boardCtx.strokeRect(startX, startY, p.x - startX, p.y - startY); } 
                else if (currentTool === 'circle') {
                    boardCtx.beginPath(); const r = Math.sqrt(Math.pow(p.x-startX,2)+Math.pow(p.y-startY,2));
                    boardCtx.arc(startX, startY, r, 0, 2*Math.PI); boardCtx.stroke();
                } else if (currentTool === 'line') { boardCtx.beginPath(); boardCtx.moveTo(startX, startY); boardCtx.lineTo(p.x, p.y); boardCtx.stroke(); }
            };
            const drawEnd = e => {
                if (!isDrawing) return; isDrawing = false; const p = getPos(e);
                if (currentTool !== 'pen' && currentTool !== 'eraser') { pushStrokeToBuffer(currentTool, startX, startY, p.x, p.y, currentColor, 4); }
                wbSnapshot = null;
            };
            whiteboardCanvas.addEventListener('mousedown', drawStart); whiteboardCanvas.addEventListener('mousemove', drawMove); window.addEventListener('mouseup', drawEnd);
            whiteboardCanvas.addEventListener('touchstart', drawStart); whiteboardCanvas.addEventListener('touchmove', drawMove); window.addEventListener('touchend', drawEnd);
        }

        function pushStrokeToBuffer(tool, x1, y1, x2, y2, color, thickness) {
            const item = { room_id: currentRoomId, sender: myClientId, tool: tool, x1: x1/whiteboardCanvas.width, y1: y1/whiteboardCanvas.height, x2: x2/whiteboardCanvas.width, y2: y2/whiteboardCanvas.height, color: color, thickness: thickness };
            wbSaveBuffer.push(item);
        }

        async function flushWhiteboardBuffer() {
            if (wbSaveBuffer.length === 0) return;
            const batch = [...wbSaveBuffer]; wbSaveBuffer = [];
            try { await supabaseClient.from('talk_whiteboard').insert(batch); } catch (err) { console.log(err); }
        }

        function remoteDrawAction(s) {
            boardCtx.strokeStyle = s.color; boardCtx.lineWidth = s.thickness; boardCtx.lineCap = 'round'; boardCtx.lineJoin = 'round';
            const w = whiteboardCanvas.width; const h = whiteboardCanvas.height;
            boardCtx.beginPath();
            if (s.tool === 'line' || s.tool === 'pen' || s.tool === 'eraser') { boardCtx.moveTo(s.x1 * w, s.y1 * h); boardCtx.lineTo(s.x2 * w, s.y2 * h); boardCtx.stroke(); } 
            else if (s.tool === 'rect') { boardCtx.strokeRect(s.x1 * w, s.y1 * h, (s.x2 - s.x1) * w, (s.y2 - s.y1) * h); } 
            else if (s.tool === 'circle') {
                const r = Math.sqrt(Math.pow((s.x2-s.x1)*w, 2) + Math.pow((s.y2-s.y1)*h, 2));
                boardCtx.arc(s.x1 * w, s.y1 * h, r, 0, 2*Math.PI); boardCtx.stroke();
            }
        }

        function redrawWhiteboardFromHistory() { if (!whiteboardCanvas.width) return; boardCtx.clearRect(0, 0, whiteboardCanvas.width, whiteboardCanvas.height); dbWhiteboardHistory.forEach(remoteDrawAction); }

        // =========================================================================
        // KURULUM VE BAŞLATICI ASENKRON DÖNGÜ
        // =========================================================================
        const initInterval = setInterval(() => {
            createUiElements();
            const grid = document.getElementById('bg-options-grid');
            if (grid && filterSelect) {
                refreshCustomBackgroundsUI();
                grid.querySelectorAll('[data-bg]').forEach(btn => {
                    btn.onclick = function(e) { e.stopPropagation(); syncSelection(btn.dataset.bg); };
                });
                filterSelect.onchange = function() { syncSelection(filterSelect.value); };

                const fileInput = document.getElementById('bg-custom-file');
                if (fileInput) {
                    fileInput.onchange = function(e) {
                        const file = e.target.files[0]; if (!file) return;
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            let targetSlot = 1;
                            for (let i = 1; i <= 5; i++) {
                                if (!localStorage.getItem(`saved_bg_custom_src_${i}`)) { targetSlot = i; break; }
                                targetSlot = i;
                            }
                            localStorage.setItem(`saved_bg_custom_src_${targetSlot}`, event.target.result);
                            refreshCustomBackgroundsUI(); syncSelection(`custom_${targetSlot}`);
                        };
                        reader.readAsDataURL(file);
                    };
                }
                const savedType = localStorage.getItem('saved_bg_type');
                if (savedType) { syncSelection(savedType); }
                clearInterval(initInterval);
            }
        }, 500);
    </script>
