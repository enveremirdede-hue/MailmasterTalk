<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MailmasterTalk Mega Pro - v8.9.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; touch-action: none; overscroll-behavior: none; }
        
        .video-matrix { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 1.25rem; 
            width: 100%; 
            height: 100%; 
            align-content: center; 
            justify-content: center;
            justify-items: center; /* Tek video olduğunda ortalasın */
            transition: all 0.3s ease-in-out; 
        }
        
        /* Ekran paylaşımı yapıldığında aktif olan alt şerit düzeni */
        .video-matrix.screen-active {
            display: flex; 
            flex-direction: row; 
            flex-wrap: nowrap; 
            height: 160px; 
            min-height: 160px;
            max-height: 160px;
            overflow-x: auto; 
            overflow-y: hidden; 
            align-items: center; 
            justify-content: flex-start;
            gap: 1rem;
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 1.25rem;
            border: 2px solid rgba(51, 65, 85, 0.5);
            z-index: 40;
        }
        
        .video-matrix.screen-active .video-wrapper { 
            width: 240px; 
            height: 135px; 
            flex-shrink: 0; 
            aspect-ratio: 16/9; 
            max-width: none;
            max-height: none;
        }

        /* ÇÖZÜM: Tek başına olan ekran devasa boyuta ulaşıp ismi ezmesin diye sınırlandı */
        .video-wrapper { 
            position: relative; 
            background: #0f172a; 
            border-radius: 1rem; 
            overflow: hidden; 
            border: 3px solid #1e293b; 
            aspect-ratio: 16/9; 
            width: 100%;
            max-width: 640px; /* En fazla bu kadar büyüyebilir */
            max-height: 360px;
            box-shadow: 0 15px 25px -5px rgba(0,0,0,0.4); 
            transition: all 0.3s ease; 
        }
        
        video { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: 10; 
        }
        .local-mirror { transform: scaleX(-1); }
        
        .avatar-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            z-index: 15;
        }

        /* Kesinlikle en üst katmanda kalması için z-index yükseltildi */
        .user-tag { 
            position: absolute; 
            bottom: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.9); 
            color: #ffffff; 
            padding: 6px 12px; 
            border-radius: 0.5rem; 
            font-size: 0.8rem; 
            font-weight: 700; 
            backdrop-filter: blur(8px); 
            border: 1px solid rgba(255,255,255,0.2); 
            z-index: 50; /* En üst katmana taşındı */
            display: flex; 
            align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            pointer-events: none;
            white-space: nowrap;
        }

        .filter-noir { filter: grayscale(100%) contrast(1.3); }
        .filter-cyber { filter: hue-rotate(85deg) saturate(2.5) contrast(1.1); }
        .filter-sepia { filter: sepia(85%) saturate(1.2); }
        
        @keyframes emojiAnimation {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            15% { opacity: 1; }
            65% { opacity: 1; }
            90%, 100% { transform: translateY(-50vh) scale(1.2) rotate(15deg); opacity: 0; }
        }
        .neon-emoji { position: fixed; bottom: 140px; font-size: 4rem; pointer-events: none; z-index: 999999; animation: emojiAnimation 2.5s ease-out forwards; filter: drop-shadow(0 0 12px rgba(255,255,255,0.5)); }

        .wb-tool { padding: 10px 14px; border-radius: 0.75rem; color: #94a3b8; transition: all 0.2s; cursor: pointer; }
        .wb-tool:hover { color: #f8fafc; background: rgba(255,255,255,0.1); }
        .wb-tool.active { background: #10b981; color: white; box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.4); }
        .wb-color { cursor: pointer; transition: transform 0.2s; }
        .wb-color.active { border-color: white !important; transform: scale(1.15); box-shadow: 0 0 8px rgba(255,255,255,0.5); }
        
        #whiteboard { touch-action: none; user-select: none; -webkit-user-select: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

    <script>
        const SUPABASE_URL = "https://atupjeqlzpuqzjpxkjri.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_AIwx6jSgROBXJeaAs-zzQw_Oo1Zz9Vd"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
        const myClientId = Math.random().toString(36).substring(2, 15);

        const avatarColors = ["bg-orange-600", "bg-blue-600", "bg-purple-600", "bg-emerald-600", "bg-pink-600", "bg-indigo-600", "bg-amber-600"];
        function getRandomAvatarColor() { return avatarColors[Math.floor(Math.random() * avatarColors.length)]; }

        const videoGrid = document.getElementById('video-grid');
        const localVideo = document.getElementById('localVideo');
        const screenVideo = document.getElementById('screenVideo');
        const screenShareView = document.getElementById('screen-share-view');
        const whiteboardCanvas = document.getElementById('whiteboard');
        const boardCtx = whiteboardCanvas.getContext('2d', { willReadFrequently: true });
        const toggleScreenVisibilityBtn = document.getElementById('toggle-screen-visibility-btn');
        const globalRecordingNotice = document.getElementById('global-recording-notice');
        
        let localStream, screenStream, p2pChannel, realTimeDBChannel;
        let peerConnections = {}; let screenPCs = {}; let iceQueues = {};        
        let userName = "Anonim"; let currentRoomId = ""; let isScreenSharing = false;
        let isDrawing = false; let currentTool = 'pen'; let currentColor = '#1e293b'; let startX = 0, startY = 0; let wbSnapshot = null;
        let isHandRaised = false; 
        
        let mediaRecorder = null; let recordedChunks = []; let combinedAudioStream = null;
        
        let dbWhiteboardHistory = []; let wbSaveBuffer = [];
        let isMicMuted = false; let isCamOff = false; let isScreenHiddenByMe = false;

        function forceHDAudioSDP(sdp) {
            if (sdp.indexOf('useinbandfec=1') !== -1) {
                return sdp.replace('useinbandfec=1', 'useinbandfec=1;maxaveragebitrate=128000;stereo=1;sprop-stereo=1');
            }
            return sdp;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) document.getElementById('room-input').value = decodeURIComponent(roomParam);

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: { echoCancellation: true, noiseSuppression: true } });
                localVideo.srcObject = localStream;
                setupWhiteboardEngine();
            } catch (e) { console.error("Cihaz izin hatası:", e); }
        });

        document.getElementById('join-btn').onclick = () => {
            const rId = document.getElementById('room-input').value.trim();
            const uName = document.getElementById('username-input').value.trim();
            if(!rId || !uName) return alert("Bilgileri doldurun.");
            userName = uName; currentRoomId = rId;
            
            const localAvatar = document.getElementById('local-avatar');
            localAvatar.innerText = userName.charAt(0).toUpperCase();
            localAvatar.className = `avatar-placeholder hidden text-5xl ${getRandomAvatarColor()}`;

            document.getElementById('local-name-tag').innerText = userName + " (Siz)";
            document.getElementById('current-room-text').innerText = rId;
            
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('main-header').classList.add('flex');
            document.getElementById('main-footer').classList.remove('hidden');
            document.getElementById('main-footer').classList.add('flex');

            initSupabaseMeshNetwork(rId);
            initSupabaseRealTimeDatabase(rId);
            loadRoomDataFromDatabase(rId);
            setInterval(flushWhiteboardBuffer, 400);
        };

        function initSupabaseRealTimeDatabase(roomCode) {
            realTimeDBChannel = supabaseClient.channel('realtime_db_changes');
            realTimeDBChannel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'talk_chat', filter: `room_id=eq.${roomCode}` }, (payload) => {
                if (payload.new.sender !== userName) renderChatMessage(payload.new.sender, payload.new.text, false);
            });
            realTimeDBChannel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'talk_whiteboard', filter: `room_id=eq.${roomCode}` }, (payload) => {
                const stroke = payload.new;
                if (!stroke.sender || stroke.sender !== myClientId) { dbWhiteboardHistory.push(stroke); remoteDrawAction(stroke); }
            });
            realTimeDBChannel.on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'talk_whiteboard', filter: `room_id=eq.${roomCode}` }, () => {
                dbWhiteboardHistory = []; wbSaveBuffer = []; boardCtx.clearRect(0, 0, whiteboardCanvas.width, whiteboardCanvas.height);
            });
            realTimeDBChannel.subscribe();
        }

        async function loadRoomDataFromDatabase(roomCode) {
            try {
                const { data: chatData } = await supabaseClient.from('talk_chat').select('*').eq('room_id', roomCode).order('created_at', { ascending: true });

        function initSupabaseMeshNetwork(roomCode) {
            p2pChannel = supabaseClient.channel(`mailmaster_mega_${roomCode}`, { config: { presence: { key: myClientId } } });
            p2pChannel
                .on('presence', { event: 'sync' }, () => handlePresenceSync(p2pChannel.presenceState()))
                .on('broadcast', { event: 'signal' }, ({ payload }) => { if (payload.targetId === myClientId) handleInboundSignal(payload); })
                .on('broadcast', { event: 'emoji' }, ({ payload }) => showEmojiAnimation(payload.emoji))
                .on('broadcast', { event: 'hand-toggle' }, ({ payload }) => {
                    const targetBadge = document.getElementById(`hand_badge_${payload.userId}`);
                    if (targetBadge) { payload.isHandRaised ? targetBadge.classList.remove('hidden') : targetBadge.classList.add('hidden'); }

                    const icon = document.getElementById(`mic_icon_${payload.userId}`);
                    if (icon) icon.className = payload.isMuted ? "fa-solid fa-microphone-slash text-red-500 mr-2" : "fa-solid fa-microphone text-emerald-400 mr-2";
                })
                .on('broadcast', { event: 'cam-toggle' }, ({ payload }) => {
                    const targetVideo = document.getElementById(`video_${payload.userId}_cam`);
                    const targetAvatar = document.getElementById(`avatar_${payload.userId}`);
                    if (payload.isCamOff) {
                        if(targetVideo) targetVideo.classList.add('hidden');
                        if(targetAvatar) targetAvatar.classList.remove('hidden');
                    } else {
                        if(targetVideo) targetVideo.classList.remove('hidden');
                        if(targetAvatar) targetAvatar.classList.add('hidden');
                    }
                })
                .on('broadcast', { event: 'screen-offer' }, () => {
                    if(!isScreenHiddenByMe) {
                        screenShareView.classList.remove('hidden');
                        videoGrid.classList.add('screen-active');
                    }
                    toggleScreenVisibilityBtn.classList.remove('hidden');
                })
                .on('broadcast', { event: 'screen-stop' }, ({ payload }) => {
                    if (screenPCs[payload.userId]) { screenPCs[payload.userId].close(); delete screenPCs[payload.userId]; }
                    resetScreenShareUI();
                })
                .on('broadcast', { event: 'clear-board-signal' }, () => {
                    dbWhiteboardHistory = []; wbSaveBuffer = []; boardCtx.clearRect(0, 0, whiteboardCanvas.width, whiteboardCanvas.height);
                })
                .on('broadcast', { event: 'recording-state-changed' }, ({ payload }) => {
                    if(payload.isRecording) { globalRecordingNotice.classList.remove('hidden'); } 
                    else { globalRecordingNotice.classList.add('hidden'); }
                })
                .subscribe(async (status) => { if (status === 'SUBSCRIBED') { await p2pChannel.track({ name: userName }); } });

        function handlePresenceSync(state) {
            Object.keys(peerConnections).forEach(id => { if (!state[id]) removeUserConnection(id); });
            Object.keys(state).forEach(id => {
                if (id === myClientId) return;
                const remoteName = (state[id] && state[id][0]) ? state[id][0].name : "Katılımcı";
                if (myClientId > id && !peerConnections[id]) buildWebRTCLink(id, remoteName, true);
            });
        }

        async function handleInboundSignal(data) {
            const rId = data.senderId;
            switch (data.type) {
                case 'offer':
                    await buildWebRTCLink(rId, data.senderName, false);
                    await peerConnections[rId].setRemoteDescription(new RTCSessionDescription(data.offer));
                    if (iceQueues[rId]) { while(iceQueues[rId].length > 0) { await peerConnections[rId].addIceCandidate(iceQueues[rId].shift()); } }
                    const answer = await peerConnections[rId].createAnswer(); answer.sdp = forceHDAudioSDP(answer.sdp);
                    await peerConnections[rId].setLocalDescription(answer);
                    sendSignalData({ type: 'answer', answer: answer, senderName: userName }, rId);
                    break;
                case 'answer':
                    if (peerConnections[rId]) {
                        await peerConnections[rId].setRemoteDescription(new RTCSessionDescription(data.answer));
                        if (iceQueues[rId]) { while(iceQueues[rId].length > 0) { await peerConnections[rId].addIceCandidate(iceQueues[rId].shift()); } }
                    }
                    break;
                case 'ice':
                    if (peerConnections[rId] && peerConnections[rId].remoteDescription) { await peerConnections[rId].addIceCandidate(new RTCIceCandidate(data.candidate)); }
                    else { if (!iceQueues[rId]) iceQueues[rId] = []; iceQueues[rId].push(new RTCIceCandidate(data.candidate)); }
                    break;
                case 'screen-offer':
                    const spc = new RTCPeerConnection(rtcConfig); screenPCs[rId] = spc;
                    spc.ontrack = ev => {
                        screenVideo.srcObject = ev.streams[0];
                        screenVideo.play().catch(e => console.log("Oynatma hatası:", e)); // Handshake onarımı
                        if(!isScreenHiddenByMe) {
                            screenShareView.classList.remove('hidden'); videoGrid.classList.add('screen-active');
                        }
                        toggleScreenVisibilityBtn.classList.remove('hidden');
                    };
                    spc.onicecandidate = ev => { if (ev.candidate) sendSignalData({ type: 'screen-ice', candidate: ev.candidate }, rId); };
                    await spc.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const sAnswer = await spc.createAnswer(); await spc.setLocalDescription(sAnswer);
                    sendSignalData({ type: 'screen-answer', answer: sAnswer }, rId);
                    break;
                case 'screen-answer':
                    if (screenPCs[rId]) { await screenPCs[rId].setRemoteDescription(new RTCSessionDescription(data.answer)); }
                    break;
                case 'screen-ice': 
                    if(screenPCs[rId] && screenPCs[rId].remoteDescription) { await screenPCs[rId].addIceCandidate(new RTCIceCandidate(data.candidate)); }
                    break;
            }
        }

        async function buildWebRTCLink(remoteId, remoteName, isInitiator) {
            if (peerConnections[remoteId]) return;
            const pc = new RTCPeerConnection(rtcConfig); peerConnections[remoteId] = pc;
            if (localStream) { localStream.getTracks().forEach(track => pc.addTrack(track, localStream)); }
            pc.onicecandidate = ev => { if (ev.candidate) sendSignalData({ type: 'ice', candidate: ev.candidate }, remoteId); };
            pc.ontrack = ev => { if (ev.track.kind === 'video') createVideoCard(remoteId, remoteName, ev.streams[0]); };
            if (isInitiator) {
                const offer = await pc.createOffer(); offer.sdp = forceHDAudioSDP(offer.sdp);
                await pc.setLocalDescription(offer);
                sendSignalData({ type: 'offer', offer: offer, senderName: userName }, remoteId);
            }
        }

        function sendSignalData(payload, targetId) { p2pChannel.send({ type: 'broadcast', event: 'signal', payload: { ...payload, senderId: myClientId, targetId: targetId } }); }

        recordStartBtn.onclick = async (e) => {
            e.stopPropagation();
            try {
                const displayStream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: { width: 1280, height: 720, frameRate: 30 },
                    audio: true 
                });
                
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const mixedOutput = audioCtx.createMediaStreamDestination();
                let hasAudioTracks = false;

                if (displayStream.getAudioTracks().length > 0) {
                    const systemSource = audioCtx.createMediaStreamSource(new MediaStream([displayStream.getAudioTracks()[0]]));
                    systemSource.connect(mixedOutput);
                    hasAudioTracks = true;
                }

                if (localStream && localStream.getAudioTracks().length > 0) {
                    const micSource = audioCtx.createMediaStreamSource(new MediaStream([localStream.getAudioTracks()[0]]));
                    micSource.connect(mixedOutput);
                    hasAudioTracks = true;
                }

                const tracks = [displayStream.getVideoTracks()[0]];
                if (hasAudioTracks) {
                    tracks.push(mixedOutput.stream.getAudioTracks()[0]);
                }

                combinedAudioStream = new MediaStream(tracks);
                recordedChunks = [];
                
                mediaRecorder = new MediaRecorder(combinedAudioStream, { mimeType: 'video/webm; codecs=vp9' });
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `MailmasterTalk-Kayit-${Date.now()}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                    }, 100);
                    
                    displayStream.getTracks().forEach(track => track.stop());
                    if(combinedAudioStream) combinedAudioStream.getTracks().forEach(track => track.stop());
                    audioCtx.close();

                    recordingControlsGroup.classList.add('hidden');
                    recordStartBtn.classList.remove('hidden');
                    recordPauseBtn.innerHTML = `<i class="fa-solid fa-pause text-xs"></i> Kaydı Durdur ve Devam Et`;
                    
                    globalRecordingNotice.classList.add('hidden');
                    if(p2pChannel) p2pChannel.send({ type: 'broadcast', event: 'recording-state-changed', payload: { isRecording: false } });
                };

                mediaRecorder.start(1000);
                
                recordStartBtn.classList.add('hidden');
                recordingControlsGroup.classList.remove('hidden');
                closeMoreMenu();

                globalRecordingNotice.classList.remove('hidden');
                if(p2pChannel) p2pChannel.send({ type: 'broadcast', event: 'recording-state-changed', payload: { isRecording: true } });

            } catch (err) {
                console.error("Kayıt başlatılamadı:", err);
            }
        };

        function setupWhiteboardEngine() {
            document.querySelectorAll('.wb-tool').forEach(btn => {
                btn.onclick = () => { document.querySelectorAll('.wb-tool').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentTool = btn.dataset.tool; }
            });
            document.querySelectorAll('.wb-color').forEach(btn => {
                btn.onclick = () => { document.querySelectorAll('.wb-color').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentColor = btn.dataset.color; }
            });
            document.getElementById('custom-color-picker').oninput = (e) => { currentColor = e.target.value; };

            whiteboardCanvas.addEventListener('pointerdown', (e) => {
                isDrawing = true; whiteboardCanvas.setPointerCapture(e.pointerId);
                const coords = getCanvasCoordinates(e); startX = coords[0]; startY = coords[1];
                wbSnapshot = boardCtx.getImageData(0, 0, whiteboardCanvas.width, whiteboardCanvas.height);
            });

            whiteboardCanvas.addEventListener('pointermove', (e) => {
                if (!isDrawing) return; 
                const coords = getCanvasCoordinates(e); const curX = coords[0]; const curY = coords[1];
                if (currentTool === 'pen' || currentTool === 'eraser') {
                    drawShape(currentTool, startX, startY, curX, curY, currentColor);
                    const drawData = { room_id: currentRoomId, sender: myClientId, type: currentTool, x1: startX, y1: startY, x2: curX, y2: curY, color: currentColor, w: whiteboardCanvas.width, h: whiteboardCanvas.height };
                    dbWhiteboardHistory.push(drawData); wbSaveBuffer.push(drawData); startX = curX; startY = curY;
                } else { boardCtx.putImageData(wbSnapshot, 0, 0); drawShape(currentTool, startX, startY, curX, curY, currentColor); }
            });

            whiteboardCanvas.addEventListener('pointerup', (e) => {
                if (!isDrawing) return; isDrawing = false; whiteboardCanvas.releasePointerCapture(e.pointerId);
                const coords = getCanvasCoordinates(e); const curX = coords[0]; const curY = coords[1];
                if (currentTool !== 'pen' && currentTool !== 'eraser') {
                    boardCtx.putImageData(wbSnapshot, 0, 0); drawShape(currentTool, startX, startY, curX, curY, currentColor);
                    const drawData = { room_id: currentRoomId, sender: myClientId, type: currentTool, x1: startX, y1: startY, x2: curX, y2: curY, color: currentColor, w: whiteboardCanvas.width, h: whiteboardCanvas.height };
                    dbWhiteboardHistory.push(drawData); wbSaveBuffer.push(drawData);
                }
                flushWhiteboardBuffer(); 
            });
        }

        async function flushWhiteboardBuffer() {

        function getCanvasCoordinates(e) {
            const rect = whiteboardCanvas.getBoundingClientRect();
            return [ (e.clientX - rect.left) * (whiteboardCanvas.width / rect.width), (e.clientY - rect.top) * (whiteboardCanvas.height / rect.height) ];
        }

        function drawShape(type, x1, y1, x2, y2, color) {
            boardCtx.lineCap = 'round'; boardCtx.lineJoin = 'round'; boardCtx.beginPath();
            boardCtx.strokeStyle = type === 'eraser' ? '#ffffff' : color; boardCtx.lineWidth = type === 'eraser' ? 24 : 4;
            if (type === 'pen' || type === 'eraser' || type === 'line') { boardCtx.moveTo(x1, y1); boardCtx.lineTo(x2, y2); }
            else if (type === 'rect') { boardCtx.rect(x1, y1, x2 - x1, y2 - y1); }
            else if (type === 'circle') { boardCtx.arc(x1, y1, Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2)), 0, 2 * Math.PI); }
            boardCtx.stroke();
        }

        function remoteDrawAction(strokeData) {
            const scaleX = whiteboardCanvas.width / strokeData.w; const scaleY = whiteboardCanvas.height / strokeData.h;
            drawShape(strokeData.type, strokeData.x1 * scaleX, strokeData.y1 * scaleY, strokeData.x2 * scaleX, strokeData.y2 * scaleY, strokeData.color);
        }

        function redrawWhiteboardFromHistory() {
            boardCtx.clearRect(0, 0, whiteboardCanvas.width, whiteboardCanvas.height);
            dbWhiteboardHistory.forEach(stroke => {
                const scaleX = whiteboardCanvas.width / stroke.w; const scaleY = stroke.h ? (whiteboardCanvas.height / stroke.h) : 1;
                drawShape(stroke.type, stroke.x1 * scaleX, stroke.y1 * scaleY, stroke.x2 * scaleX, stroke.y2 * scaleY, stroke.color);
            });
        }

        function resizeCanvasToDisplay() {

                    whiteboardCanvas.width = rect.width; whiteboardCanvas.height = rect.height;
                    redrawWhiteboardFromHistory();

            }
        }

            if (isHandRaised) { localHand.classList.remove('hidden'); handBtn.className = "bg-amber-500 text-white w-14 h-14 rounded-xl flex items-center justify-center text-2xl shadow-lg flex-shrink-0"; }
            else { localHand.classList.add('hidden'); handBtn.className = "bg-slate-800 hover:bg-slate-700 text-slate-200 w-14 h-14 rounded-xl flex items-center justify-center border border-slate-700 text-2xl shadow-lg flex-shrink-0"; }
            if (p2pChannel) p2pChannel.send({ type: 'broadcast', event: 'hand-toggle', payload: { userId: myClientId, isHandRaised: isHandRaised } });
        };

        const moreOptionsToggle = document.getElementById('more-options-toggle');
        const moreOptionsMenu = document.getElementById('more-options-menu');
        moreOptionsToggle.onclick = (e) => { e.stopPropagation(); moreOptionsMenu.classList.contains('pointer-events-none') ? moreOptionsMenu.classList.remove('scale-90', 'opacity-0', 'pointer-events-none').then(moreOptionsMenu.classList.add('scale-100', 'opacity-100', 'pointer-events-auto')) : closeMoreMenu(); };
        document.addEventListener('click', closeMoreMenu);
        function closeMoreMenu() { moreOptionsMenu.classList.add('scale-90', 'opacity-0', 'pointer-events-none'); moreOptionsMenu.classList.remove('scale-100', 'opacity-100', 'pointer-events-auto'); }

        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');
        document.getElementById('send-chat-btn').onclick = sendChatMessage;
        chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendChatMessage(); };

        function sendChatMessage() {
            const msg = chatInput.value.trim(); if (!msg) return; 
            renderChatMessage("Siz", msg, true);
            supabaseClient.from('talk_chat').insert([{ room_id: currentRoomId, sender: userName, text: msg }]).then();
            chatInput.value = "";
        }
        function renderChatMessage(sender, text, isLocal) {
            const div = document.createElement('div'); div.className = "bg-slate-950 p-2.5 rounded-xl border border-slate-800/40";
            div.innerHTML = `<span class="block text-[10px] font-bold text-emerald-400 mb-0.5">${isLocal ? "Siz" : sender}</span><p class="text-slate-200 font-medium">${text}</p>`;
            chatMessages.appendChild(div); chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendReaction(emoji) { showEmojiAnimation(emoji); if(p2pChannel) p2pChannel.send({ type: 'broadcast', event: 'emoji', payload: { emoji: emoji } }); }
        function showEmojiAnimation(emoji) { const div = document.createElement('div'); div.className = 'neon-emoji'; div.innerText = emoji; div.style.left = Math.random() * 50 + 25 + 'vw'; document.body.appendChild(div); setTimeout(() => div.remove(), 2600); }

        document.getElementById('hangup-btn').onclick = () => { if(confirm("Ayrılmak istiyor musunuz?")) location.reload(); };
    </script>
<script>
        (function() {
            const tag = document.getElementById('local-name-tag');
            const joinBtn = document.getElementById('join-btn');
            const uInput = document.getElementById('username-input');
            const rInput = document.getElementById('room-input');

            // 1. Sayfa açıldığında ve kamera ilk yüklendiğinde etiketi sürekli gizli tut
            if (tag && tag.parentElement) {
                tag.parentElement.style.setProperty('display', 'none', 'important');
                
                // MutationObserver ile ana kodun sonradan display'i değiştirmesini de kilitliyoruz
                const observer = new MutationObserver(() => {
                    if (tag.parentElement.style.display !== 'none' && !joinBtn.dataset.joined) {
                        tag.parentElement.style.setProperty('display', 'none', 'important');
                    }
                });
                observer.observe(tag.parentElement, { attributes: true, attributeFilter: ['style'] });
            }

            // 2. Sadece isim ve oda dolup gerçekten giriş yapıldığında etiketi göster
            if (joinBtn) {
                const originalClick = joinBtn.onclick;
                joinBtn.onclick = function(e) {
                    const rId = rInput ? rInput.value.trim() : "";
                    const uName = uInput ? uInput.value.trim() : "";
                    
                    if (rId && uName) {
                        joinBtn.dataset.joined = "true"; // Kilidi aç
                        if (tag && tag.parentElement) {
                            tag.parentElement.style.setProperty('display', 'flex', 'important');
                        }
                    }
                    if (originalClick) originalClick.call(this, e);
                };
            }

            // 3. EKRAN PAYLAŞIMI BUTONU ONARIMI VE ANİMASYON YAMASI
            const shareScreenBtn = document.getElementById('share-screen');
            if (shareScreenBtn) {
                // CSS animasyonunu dinamik olarak koda enjekte ediyoruz
                const style = document.createElement('style');
                style.innerHTML = `
                    @keyframes pulse-fill {
                        0% { background-color: rgba(14, 165, 233, 0.2); box-shadow: inset 0 0 0px rgba(14, 165, 233, 0.4); }
                        50% { background-color: rgba(14, 165, 233, 0.9); box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.6); color: #ffffff; }
                        100% { background-color: rgba(14, 165, 233, 0.2); box-shadow: inset 0 0 0px rgba(14, 165, 233, 0.4); }
                    }
                    .screen-sharing-active {
                        animation: pulse-fill 2s infinite ease-in-out !important;
                        color: #ffffff !important;
                        border-color: #0ea5e9 !important;
                    }
                `;
                document.head.appendChild(style);

                // Orijinal tıklama fonksiyonunu güvenli bir şekilde devralıyoruz
                const originalScreenClick = shareScreenBtn.onclick;
                shareScreenBtn.onclick = function(e) {
                    // Eğer ekran zaten paylaşılıyorsa veya global bayrak true ise kapatmayı zorla
                    if (window.isScreenSharing || shareScreenBtn.classList.contains('screen-sharing-active')) {
                        if (typeof resetScreenShareUI === 'function') {
                            resetScreenShareUI();
                            window.isScreenSharing = false;
                            shareScreenBtn.classList.remove('screen-sharing-active');
                            return;
                        }
                    }
                    
                    // Paylaşım başlatılıyorsa orijinal fonksiyonu çalıştır
                    if (originalScreenClick) originalScreenClick.call(this, e);
                    
                    // Başlatma işleminden hemen sonra durumu kontrol et ve animasyonu bağla
                    setTimeout(() => {
                        // Eğer akış başarıyla başladıysa global değişkeni senkronize et ve sınıfı ekle
                        if (document.getElementById('screenVideo') && document.getElementById('screenVideo').srcObject) {
                            window.isScreenSharing = true;
                            shareScreenBtn.className = "w-14 h-14 rounded-xl flex items-center justify-center border text-2xl transition-all shadow-lg flex-shrink-0 screen-sharing-active";
                        }
                    }, 500);
                };

                // Sistem arayüzünden (tarayıcının altındaki "Paylaşımı Durdur" butonundan) kapatılırsa tetiklenecek izleyici
                setInterval(() => {
                    const screenVideoEl = document.getElementById('screenVideo');
                    if (window.isScreenSharing && (!screenVideoEl || !screenVideoEl.srcObject || screenVideoEl.srcObject.getTracks().length === 0)) {
                        window.isScreenSharing = false;
                        shareScreenBtn.className = "bg-slate-800 hover:bg-slate-700 w-14 h-14 rounded-xl flex items-center justify-center border border-slate-700 text-sky-400 text-2xl transition-all shadow-lg flex-shrink-0";
                    }
                }, 1000);
            }
        })();
    </script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation"></script>

    <script>
        (function() {
            // =========================================================================
            // 1. ODA LİNKİ KOPYALAMA VE YEŞİL TİK ANİMASYONU
            // =========================================================================
            const copyBtn = document.getElementById('copy-room-link-btn');
            if (copyBtn) {
                copyBtn.onclick = async function(e) {
                    e.preventDefault(); e.stopPropagation();
                    const roomTextEl = document.getElementById('current-room-text');
                    if (!roomTextEl) return;
                    
                    const roomCode = roomTextEl.innerText.trim();
                    const currentUrl = window.location.origin + window.location.pathname + "?room=" + encodeURIComponent(roomCode);
                    
                    try {
                        await navigator.clipboard.writeText(currentUrl);
                        const originalIcon = copyBtn.innerHTML;
                        copyBtn.innerHTML = `<i class="fa-solid fa-check text-emerald-400 animate-bounce"></i>`;
                        copyBtn.style.pointerEvents = 'none';
                        setTimeout(() => { copyBtn.innerHTML = originalIcon; copyBtn.style.pointerEvents = 'auto'; }, 2000);
                    } catch (err) { console.error("Kopyalama başarısız:", err); }
                };
            }

            // =========================================================================
            // 2. ARKA PLAN DEĞİŞTİRME MODAL VE ARAYÜZÜNÜN OLUŞTURULMASI
            // =========================================================================
            const moreMenu = document.getElementById('more-options-menu');
            if (moreMenu && !document.getElementById('open-bg-modal-btn')) {
                const bgBtn = document.createElement('button');
                bgBtn.id = 'open-bg-modal-btn';
                bgBtn.className = 'w-full text-left bg-slate-950/80 hover:bg-slate-800 text-sky-400 text-sm font-bold p-3.5 rounded-xl flex items-center gap-3 border border-sky-500/10 transition-all mt-1';
                bgBtn.innerHTML = `<i class="fa-solid fa-images text-xs"></i> Arka Planı Değiştir`;
                moreMenu.appendChild(bgBtn);
            }

            const modal = document.createElement('div');
            modal.id = 'bg-transform-modal';
            modal.className = 'fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[999999] hidden flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 relative shadow-2xl">
                    <button id="close-bg-modal-btn" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl w-8 h-8 flex items-center justify-center bg-slate-950 rounded-full border border-slate-800 transition-all">
                        <i class="fa-solid fa-times"></i>
                    </button>
                    <h3 class="text-lg font-black text-slate-100 mb-1 flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-emerald-400"></i> AI Arka Plan Değiştirici
                    </h3>
                    <p class="text-xs text-slate-400 mb-5">Yapay zeka sizi algılar ve sadece arkadaki manzarayı değiştirir.</p>
                    
                    <div class="grid grid-cols-2 gap-3 max-h-[320px] overflow-y-auto pr-1">
                        <button class="bg-slate-950 border-2 border-emerald-500 p-4 rounded-xl text-sm font-bold flex flex-col items-center gap-2 transition-all" data-bg="none">
                            <i class="fa-solid fa-video text-xl text-slate-400"></i> Efekt Yok
                        </button>
                        <button class="bg-slate-950 border-2 border-slate-800 p-4 rounded-xl text-sm font-bold flex flex-col items-center gap-2 transition-all" data-bg="blur">
                            <i class="fa-solid fa-eye-slash text-xl text-sky-400"></i> Arka Planı Bulanıklaştır
                        </button>
                        <button class="bg-slate-950 border-2 border-slate-800 p-4 rounded-xl text-sm font-bold flex flex-col items-center gap-2 transition-all" data-bg="cyber">
                            <i class="fa-solid fa-user-astronaut text-xl text-purple-400"></i> Cyber Space
                        </button>
                        <button class="bg-slate-950 border-2 border-slate-800 p-4 rounded-xl text-sm font-bold flex flex-col items-center gap-2 transition-all" data-bg="home">
                            <i class="fa-solid fa-house text-xl text-amber-400"></i> Normal Ev
                        </button>
                        <button class="bg-slate-950 border-2 border-slate-800 p-4 rounded-xl text-sm font-bold flex flex-col items-center gap-2 transition-all" data-bg="park">
                            <i class="fa-solid fa-tree text-xl text-green-400"></i> Yeşil Park
                        </button>
                        <label class="bg-slate-950 border-2 border-dashed border-slate-700 p-4 rounded-xl text-sm font-bold flex flex-col items-center justify-center gap-2 hover:border-emerald-500 transition-all cursor-pointer text-center">
                            <i class="fa-solid fa-cloud-arrow-up text-xl text-slate-400"></i>
                            <span>Fotoğraf Yükle</span>
                            <input type="file" id="bg-custom-file" accept="image/*" class="hidden">
                        </label>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('open-bg-modal-btn').onclick = function(e) {
                e.stopPropagation(); modal.classList.remove('hidden');
                const m = document.getElementById('more-options-menu'); if (m) m.classList.add('scale-90', 'opacity-0', 'pointer-events-none');
            };
            document.getElementById('close-bg-modal-btn').onclick = function() { modal.classList.add('hidden'); };

            // =========================================================================
            // 3. YAPAY ZEKA GÖVDE SEGMENTASYONU VE ARKA PLAN İŞLEME MOTORU
            // =========================================================================
            const localVideo = document.getElementById('localVideo');
            let currentEffect = 'none';
            let bgImageObj = new Image();
            bgImageObj.crossOrigin = "anonymous";

            // Hazır görsellerin base64 formatları (Link kırılma veya CORS hatasını tamamen önlemek için)
            const bgPresets = {
                cyber: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="100%" height="100%" fill="%23090514"/><path d="M0 180h640M320 0v360M160 0l320 360M480 0L160 360" stroke="%233b82f6" stroke-width="1" opacity="0.3"/><circle cx="320" cy="180" r="100" stroke="%23a855f7" stroke-width="2" fill="none" opacity="0.5"/></svg>',
                home: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="100%" height="100%" fill="%231e1b4b"/><rect x="80" y="60" width="160" height="200" fill="%23312e81" rx="8"/><line x1="0" y1="280" x2="640" y2="280" stroke="%234338ca" stroke-width="4"/></svg>',
                park: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="100%" height="100%" fill="%23064e3b"/><circle cx="120" cy="400" r="250" fill="%23047857"/><circle cx="520" cy="420" r="200" fill="%23059669"/></svg>'
            };

            // Gizli işleme tuvali (Canvas) oluşturup video akışını buna yönlendiriyoruz
            const outputCanvas = document.createElement('canvas');
            outputCanvas.id = 'ai-processed-canvas';
            outputCanvas.className = 'local-mirror filter-none absolute inset-0 w-full h-full object-cover z-10';
            const ctx = outputCanvas.getContext('2d');
            
            // Gerçek yerel video elementini gizleyip yerine canvası yerleştiriyoruz
            localVideo.style.opacity = '0';
            localVideo.parentElement.appendChild(outputCanvas);

            // MediaPipe Yapay Zeka Modelini Kurma
            const selfieSegmentation = new SelfieSegmentation({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
            });

            selfieSegmentation.setOptions({ modelSelection: 1 }); // 1: Genel model, kararlı ve performanslı

            selfieSegmentation.onResults((results) => {
                if (outputCanvas.width !== localVideo.videoWidth) {
                    outputCanvas.width = localVideo.videoWidth || 640;
                    outputCanvas.height = localVideo.videoHeight || 360;
                }

                ctx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
                ctx.save();

                // Eğer efekt "none" ise sadece doğrudan kamerayı çiz, yapay zekayı yorma
                if (currentEffect === 'none') {
                    ctx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
                    ctx.restore();
                    return;
                }

                // 1. ADIM: Maskeyi çiz (Yapay zekanın insanı seçtiği alan)
                ctx.drawImage(results.segmentationMask, 0, 0, outputCanvas.width, outputCanvas.height);

                // 2. ADIM: İnsanın dışındaki alanı (Arka Planı) belirle ve oraya efekti uygula
                ctx.globalCompositeOperation = 'source-out';
                if (currentEffect === 'blur') {
                    // Kamera görüntüsünü arka plana kopyala ve bulanıklaştır
                    ctx.filter = 'blur(16px)';
                    ctx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
                    ctx.filter = 'none';
                } else if (bgImageObj.src) {
                    // Seçilen veya yüklenen arka plan görselini yerleştir
                    ctx.drawImage(bgImageObj, 0, 0, outputCanvas.width, outputCanvas.height);
                }

                // 3. ADIM: İnsanı (Özneyi) kesilen maskenin içine pürüzsüzce yerleştir
                ctx.globalCompositeOperation = 'destination-over';
                ctx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);

                ctx.restore();
            });

            // Gerçek zamanlı kare yakalama döngüsü
            async function updateAIFrame() {
                if (localVideo.readyState >= 2 && !localVideo.paused) {
                    await selfieSegmentation.send({ image: localVideo });
                }
                requestAnimationFrame(updateAIFrame);
            }
            localVideo.addEventListener('play', () => { updateAIFrame(); });

            // Kullanıcı seçim olayları
            modal.querySelectorAll('[data-bg]').forEach(btn => {
                btn.onclick = function() {
                    modal.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('border-emerald-500'));
                    btn.classList.add('border-emerald-500');
                    
                    currentEffect = btn.dataset.bg;
                    if (bgPresets[currentEffect]) {
                        bgImageObj.src = bgPresets[currentEffect];
                    }
                };
            });

            // Kendi fotoğrafını yükleme işleyicisi
            const fileInput = document.getElementById('bg-custom-file');
            if (fileInput) {
                fileInput.onchange = function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        currentEffect = 'custom';
                        bgImageObj.src = event.target.result;
                        modal.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('border-emerald-500'));
                    };
                    reader.readAsDataURL(file);
                };
            }
            
            // WebRTC'ye işlenmiş görüntüyü gönderebilmek için localStream video track'ini canvas ile değiştiriyoruz
            setTimeout(() => {
                if (typeof localStream !== 'undefined' && localStream) {
                    const canvasStream = outputCanvas.captureStream(30);
                    const newVideoTrack = canvasStream.getVideoTracks()[0];
                    const oldVideoTrack = localStream.getVideoTracks()[0];
                    if (oldVideoTrack && newVideoTrack) {
                        localStream.removeTrack(oldVideoTrack);
                        localStream.addTrack(newVideoTrack);
                        // Mevcut aktif P2P bağlantılarındaki track'leri güncelle
                        Object.keys(peerConnections).forEach(id => {
                            const senders = peerConnections[id].getSenders();
                            const sender = senders.find(s => s.track && s.track.kind === 'video');
                            if (sender) sender.replaceTrack(newVideoTrack);
                        });
                    }
                }
            }, 2000);
        })();
    </script>
